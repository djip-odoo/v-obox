name: "Wails3 Build Action"
description: "Builds a Wails v3 application using go-task and wails3 CLI"

inputs:
        build:
                description: "Whether to build the application"
                required: false
                default: "true"
        sign:
                description: "Sign the build"
                required: false
                default: "false"
        package:
                description: "Uploads workflow artifacts & uploads tag builds to a release"
                required: false
                default: "true"
        build-name:
                description: "The name of the binary file"
                required: true
        macos-app-name:
                description: "The name of the macOS app (without .app)"
                required: false
                default: "Wails App"
        go-version:
                description: "Version of Go to use"
                required: false
                default: "1.26.0"
        node-version:
                description: "Node.js version"
                required: false
                default: "22.x"
        app-working-directory:
                description: "Working directory containing the Wails app"
                required: false
                default: "."
        sign-macos-app-id:
                description: "macOS Application Certificate id"
                required: false
                default: ''
        sign-macos-apple-password:
                description: "macOS Apple password"
                required: false
                default: ''
        sign-macos-app-cert:
                description: "macOS Application Certificate"
                required: false
                default: ''
        sign-macos-app-cert-password:
                description: "macOS Application Certificate Password"
                required: false
                default: ''
        sign-macos-installer-id:
                description: "macOS Installer Certificate id"
                required: false
                default: ''
        sign-macos-installer-cert:
                description: "macOS Installer Certificate"
                required: false
                default: ''
        sign-macos-installer-cert-password:
                description: "macOS Installer Certificate Password"
                required: false
                default: ''
        sign-windows-cert:
                description: "Windows Signing Certificate"
                required: false
                default: ''
        sign-windows-cert-password:
                description: "Windows Signing Certificate Password"
                required: false
                default: ''
        token:
                description: "GitHub token"
                required: false
                default: ''

runs:
        using: "composite"
        steps:
                # ── Toolchain Setup ──────────────────────────────────────────
                - name: Setup Go
                  uses: actions/setup-go@v5
                  with:
                          go-version: ${{inputs.go-version}}
                          cache: true

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                          node-version: ${{inputs.node-version}}

                # ── Platform Dependencies ────────────────────────────────────
                - name: Install Linux dependencies
                  if: inputs.build == 'true' && runner.os == 'Linux'
                  shell: bash
                  run: |
                          sudo apt-get update
                          sudo apt-get install -y \
                            build-essential \
                            pkg-config \
                            libgtk-4-dev \
                            libwebkitgtk-6.0-dev \
                            libusb-1.0-0-dev

                - name: Install macOS dependencies
                  if: runner.os == 'macOS'
                  shell: bash
                  run: brew install mitchellh/gon/gon libusb

                - name: Setup MSYS2 (Windows)
                  if: runner.os == 'Windows'
                  uses: msys2/setup-msys2@v2
                  with:
                          msystem: MINGW64
                          path-type: inherit
                          install: >-
                            mingw-w64-x86_64-libusb
                            mingw-w64-x86_64-gcc
                            mingw-w64-x86_64-pkg-config
                            mingw-w64-x86_64-nsis

                # ── Wails3 & Task Toolchain ──────────────────────────────────
                - name: Install Wails3 CLI & Task runner
                  if: inputs.build == 'true'
                  shell: bash
                  run: |
                          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
                          go install github.com/go-task/task/v3/cmd/task@latest
                          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
                          echo "Installed wails3 at $(which wails3 || echo not in path)"
                          echo "Installed task at $(which task || echo not in path)"

                # ── Build ────────────────────────────────────────────────────
                - name: Build (Linux)
                  if: inputs.build == 'true' && runner.os == 'Linux'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: |
                          task linux:build
                          mv bin/epos-proxy bin/${{inputs.build-name}}

                - name: Build (macOS)
                  if: inputs.build == 'true' && runner.os == 'macOS'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: task darwin:build

                - name: Resolve Go binary path (Windows)
                  if: runner.os == 'Windows'
                  shell: bash
                  run: echo "GO_BIN=$(ls -d /c/hostedtoolcache/windows/go/*/x64/bin | tail -1)" >> $GITHUB_ENV

                - name: Build (Windows)
                  if: inputs.build == 'true' && runner.os == 'Windows'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: msys2 {0}
                  run: |
                          export PATH="$PATH:/c/Users/runneradmin/go/bin:$GO_BIN:/c/Program Files/nodejs"
                          task windows:build CGO_ENABLED=1
                          task windows:package
                          # Rename outputs to build-name
                          mv bin/epos-proxy.exe bin/${{inputs.build-name}}.exe
                          mv bin/epos-proxy-amd64-installer.exe bin/${{inputs.build-name}}-installer.exe
                          # Keep only the installer for upload
                          find bin/ -type f ! -name "${{inputs.build-name}}-installer.exe" -delete
                  env:
                          CGO_ENABLED: "1"
                          CGO_CFLAGS: "-I/mingw64/include/libusb-1.0"
                          CGO_LDFLAGS: "-L/mingw64/lib -lusb-1.0 -static -lsetupapi"

                # ── Tests ────────────────────────────────────────────────────
                - name: Run Tests (Linux / macOS)
                  if: inputs.build == 'true' && runner.os != 'Windows'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: go test -v ./...

                - name: Run Tests (Windows)
                  if: inputs.build == 'true' && runner.os == 'Windows'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: msys2 {0}
                  run: |
                          export PATH="$PATH:/c/Users/runneradmin/go/bin:$GO_BIN"
                          go test -v ./...
                  env:
                          CGO_ENABLED: "1"
                          CGO_CFLAGS: "-I/mingw64/include/libusb-1.0"
                          CGO_LDFLAGS: "-L/mingw64/lib -lusb-1.0 -static -lsetupapi"

                # ── Permissions ──────────────────────────────────────────────
                - name: Set executable permissions (Linux)
                  if: inputs.build == 'true' && runner.os == 'Linux'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: chmod +x bin/*

                - name: Set executable permissions (macOS)
                  if: inputs.build == 'true' && runner.os == 'macOS'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: chmod +x build/bin/*/Contents/MacOS/*

                # ── macOS Signing ────────────────────────────────────────────
                - name: Import Code-Signing Certificates for macOS
                  if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
                  uses: Apple-Actions/import-codesign-certs@v1
                  with:
                          keychain-password: ${{ inputs.sign-macos-apple-password }}
                          p12-file-base64: ${{ inputs.sign-macos-app-cert }}
                          p12-password: ${{ inputs.sign-macos-app-cert-password }}

                - name: Import Code-Signing Certificates for macOS Installer
                  if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
                  uses: Apple-Actions/import-codesign-certs@v1
                  with:
                          keychain-password: ${{ inputs.sign-macos-apple-password }}
                          p12-file-base64: ${{ inputs.sign-macos-installer-cert }}
                          p12-password: ${{ inputs.sign-macos-installer-cert-password }}
                          create-keychain: false

                - name: Sign macOS binary
                  if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
                  shell: bash
                  working-directory: ${{ inputs.app-working-directory }}
                  env:
                          APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
                  run: |
                          echo "Signing Package"
                          gon -log-level=info ./build/darwin/gon-sign.json

                - name: Build macOS .app zip file
                  if: runner.os == 'macOS'
                  working-directory: ${{ inputs.app-working-directory }}
                  shell: bash
                  run: |
                          ditto -c -k "./build/bin/${{inputs.macos-app-name}}.app" ./build/bin/${{inputs.build-name}}.app.zip

                - name: Build macOS Installer
                  if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-installer-id != '' && startsWith(github.ref, 'refs/tags/')
                  shell: bash
                  working-directory: ${{ inputs.app-working-directory }}
                  run: |
                          productbuild --sign '${{inputs.sign-macos-installer-id}}' --component ./build/bin/${{inputs.build-name}}.app ./build/bin/${{inputs.build-name}}.pkg

                - name: Notarise macOS Installer and zip
                  if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
                  shell: bash
                  working-directory: ${{ inputs.app-working-directory }}
                  env:
                          APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
                  run: |
                          gon -log-level=info ./build/darwin/gon-notarize.json

                # ── Windows Signing ──────────────────────────────────────────
                - name: Sign Windows binaries
                  shell: powershell
                  if: runner.os == 'Windows' && inputs.sign != 'false' && inputs.sign-windows-cert != ''
                  working-directory: ${{ inputs.app-working-directory }}
                  run: |
                          echo "Creating certificate file"
                          New-Item -ItemType directory -Path certificate
                          Set-Content -Path certificate\certificate.txt -Value '${{ inputs.sign-windows-cert }}'
                          certutil -decode certificate\certificate.txt certificate\certificate.pfx
                          echo "Signing binaries"
                          & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p '${{ inputs.sign-windows-cert-password }}' .\bin\${{inputs.build-name}}-installer.exe

                # ── Upload & Release ─────────────────────────────────────────
                - uses: actions/upload-artifact@v4
                  if: inputs.package == 'true' && runner.os != 'Windows'
                  with:
                          name: Wails Build ${{runner.os}} ${{inputs.build-name}}
                          path: |
                                  ${{ inputs.app-working-directory }}/bin/

                - uses: actions/upload-artifact@v4
                  if: inputs.package == 'true' && runner.os == 'Windows'
                  with:
                          name: Wails Build ${{runner.os}} ${{inputs.build-name}}
                          path: |
                                  ${{ inputs.app-working-directory }}/bin/${{inputs.build-name}}-installer.exe

                - name: Release
                  uses: softprops/action-gh-release@v2
                  if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
                  with:
                          files: |
                                  ${{ inputs.app-working-directory }}/bin/*
                  env:
                        GITHUB_TOKEN: ${{ inputs.token }}
